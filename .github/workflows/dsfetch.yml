name: Fetch DeepState sample
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -A "$UA" -o out/list.json -w "%{http_code} %{size_download}\n" https://deepstatemap.live/api/history/public || true
          python3 - <<'PY'
          import json,time,calendar,subprocess
          L=json.load(open('out/list.json'))
          def ts(x): return calendar.timegm(time.strptime(x['createdAt'][:19],'%Y-%m-%dT%H:%M:%S'))
          L.sort(key=ts)
          new=L[-1]; t=ts(new)-30*86400
          old=[x for x in L if ts(x)<=t][-1]
          print(new['id'],new['createdAt'],old['id'],old['createdAt'])
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for n,x in (('new',new),('old',old)):
              subprocess.run(['curl','-sS','-A',UA,'-o','out/%s.json'%n,'https://deepstatemap.live/api/history/%d/geojson'%x['id']])
          PY
          ls -la out
      - run: |
          cd out && gzip -9 *.json && git init -q && git checkout -q -b dsdata && git add . \
            && git -c user.name=ci -c user.email=ci@x commit -qm data \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dsdata
