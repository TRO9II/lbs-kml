name: Fetch DeepState sample
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -A "$UA" -o out/new.json -w "%{http_code} %{size_download}\n" https://deepstatemap.live/api/history/1794169351/geojson || true
          curl -sS -A "$UA" -o out/old.json -w "%{http_code} %{size_download}\n" https://deepstatemap.live/api/history/1792097295/geojson || true
          curl -sS -A "$UA" -o out/last.json -w "%{http_code} %{size_download}\n" https://deepstatemap.live/api/history/last || true
          curl -sS -A "$UA" -o out/list.json -w "%{http_code} %{size_download}\n" https://deepstatemap.live/api/history/public || true
          ls -la out; head -c 300 out/new.json
      - uses: actions/upload-artifact@v4
        with:
          name: ds
          path: out
