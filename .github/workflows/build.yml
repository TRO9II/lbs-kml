name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LbsKml.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LbsKml-apk
          path: LbsKml.apk

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create latest LbsKml.apk --title "Рубеж v$VERSION" --notes "v$VERSION · сборка ${GITHUB_SHA::7}"
