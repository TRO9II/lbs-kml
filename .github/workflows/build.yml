name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        env:
          KS: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/rubezh.jks; echo "Подпись: постоянный ключ"; else echo "::warning::Секрет SIGN_KEYSTORE_B64 не задан — подпись случайным ключом"; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LbsKml.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LbsKml-apk
          path: LbsKml.apk

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # список изменений этой версии — из app/src/main/assets/changes.txt
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' app/src/main/assets/changes.txt | sed '/^$/d' > notes.txt
          [ -s notes.txt ] || echo "- Исправления и улучшения" > notes.txt
          echo "" >> notes.txt
          echo "v$VERSION · сборка ${GITHUB_SHA::7}" >> notes.txt
          gh release create latest LbsKml.apk --title "Рубеж v$VERSION" --notes-file notes.txt
