name: Check tiles
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_ov.py
      - run: |
          mkdir cls && javac -d cls app/src/main/java/ru/lbs/kml/Mvt.java scripts/mvt/T.java && java -cp cls ru.lbs.kml.T
