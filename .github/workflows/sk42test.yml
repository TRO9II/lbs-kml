name: Verify SK-42
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install pyproj
      - run: |
          mkdir -p out
          javac -d out app/src/main/java/ru/lbs/kml/Sk42.java scripts/sk42test/Sk42Test.java
          java -cp out ru.lbs.kml.Sk42Test > mine.txt
          python3 scripts/sk42test/compare.py mine.txt
